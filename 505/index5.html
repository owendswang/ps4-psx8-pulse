<!DOCTYPE html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

        body {

        .container {

        .chain-selector {

            border-top: 1px solid #454545;
            display: flex;
            flex-wrap: wrap;
margin-top: 12px;
            padding-top: 12px;
        }

        .chain-label { color: #b5b5b5; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
        .chain-options { display: flex; }
        .chain-option,
        .buttons-grid button {
            background: #080c0a;
            border: 1px solid #6f63a8;
            border-radius: 0;
            color: #f5f5f5;
            cursor: pointer;
            font: inherit;
            min-height: 42px;
            padding: 8px 12px;
            transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .chain-option:hover,
        .chain-option:focus,
        .chain-option[aria-pressed="true"],
        .buttons-grid button:hover,
        .buttons-grid button:focus {
            background: #0d1510;
            border-color: #a294ff;
            color: #a294ff;
            outline: none;
        }

        .chain-note { color: #828282; font-size: 12px; }
        .controls-section { margin: 12px 0 0; min-width: 0; padding: 16px 18px; }
        .buttons-grid button:disabled { opacity: 0.45; cursor: not-allowed; }
        .section-title { border-bottom: 1px solid #454545; color: #b5b5b5; font-size: 14px; letter-spacing: 0.12em; margin-bottom: 12px; padding-bottom: 9px; text-transform: uppercase; }
        .buttons-grid {
            display: flex;
            flex-wrap: wrap;
            margin: -4px;
        }

        .credits {

            flex: 0 0 auto;

            margin: 0 auto;

        .credits a { color: #f5f5f5; }

            .header-section { padding: 20px 18px 22px; }

            .chain-selector { align-items: flex-start; flex-direction: column; }
            .chain-options { width: 100%; }
            .chain-option { flex: 1; }
            .buttons-grid button { flex-basis: 45%; }

        function load_payload() {
            document.getElementById("controls").disabled = true;
            var req1 = new XMLHttpRequest();
            req1.open('GET', PLfile); req1.responseType = "arraybuffer";
            req1.onerror = function () { msgs.innerHTML = "Payload Load Failed - Reload To Retry"; };
            req1.onreadystatechange = function () {
                if (req1.readyState == 4) {
                    if (req1.status !== 200 || !req1.response || !req1.response.byteLength) {
                        req1.onerror();
                        return;
                    }
                    var padding1 = new Uint8Array(4 - (req1.response.byteLength % 4) % 4);
                    var tmp1 = new Uint8Array(req1.response.byteLength + padding1.byteLength);
                    tmp1.set(new Uint8Array(req1.response), 0);
                    tmp1.set(padding1, req1.response.byteLength);
                    var shellcode1 = new Uint32Array(tmp1.buffer);
                    var code_addr1 = new int64(0x26100000, 0x00000009);
                    p.syscall(477, code_addr1, 0x300000, 7, 0x41000, -1, 0);
                    for (var i = 0; i < shellcode1.length; i++) {
                        p.write4(code_addr1.add32(0x100000 + i * 4), shellcode1[i]);

                    runPAYLOAD1 = function () {
                        p.fcall(code_addr1);
                        PLfile = null;
                        for (var x = 0; x < 0x300000; x += 8) {
                            p.write8(code_addr1.add32(x), 0);
                        } setTimeout(allset, 50);
                    };
                    setTimeout(runPAYLOAD1, 100);
                }
            };
            req1.send();
        }
