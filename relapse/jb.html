<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation Pulse Relapse Host</title>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #050706;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background-color: #050706;
      background-image: linear-gradient(rgba(115, 245, 166, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(115, 245, 166, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      font: 16px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex: 1 0 auto;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: 24px 0 20px;
      width: calc(100% - 64px);
      max-width: 1120px;
    }

    .header-section,
    .status-container {
      background: rgba(8, 12, 10, 0.92);
      border: 1px solid #454545;
    }

    .header-section {
      margin-bottom: 12px;
      padding: 20px 28px 22px;
      position: relative;
    }

    .header-section::before {
      color: #a294ff;
      content: "●  PS4 / Relapse HOST";
      display: block;
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .header-section::after {
      color: #828282;
      content: "SYS / READY   //   AUTO JAILBREAK";
      font-size: 12px;
      letter-spacing: 0.08em;
      position: absolute;
      right: 28px;
      top: 21px;
    }

    .main-title {
      color: #f5f5f5;
      font-size: 50px;
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 1.05;
    }

    .main-title::before {
      color: #a294ff;
      content: "> ";
    }

    .subtitle {
      color: #a294ff;
      font-size: 16px;
      margin-top: 12px;
    }

    .version-info {
      color: #b5b5b5;
      font-size: 14px;
      margin-top: 7px;
    }

    #UA {
      color: #828282;
      display: block;
      font-size: 12px;
      margin-top: 7px;
      word-wrap: break-word;
    }

    .status-container {
      color: #b5b5b5;
      padding: 14px 18px;
    }

    .status-label {
      border-bottom: 1px solid #454545;
      color: #b5b5b5;
      font-size: 14px;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      padding-bottom: 9px;
      text-transform: uppercase;
    }

    #state,
    #out {
      background: #080c0a;
      border: 1px solid #6f63a8;
      color: #f5f5f5;
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      overflow: auto;
      padding: 10px 14px;
      white-space: pre-wrap;
    }

    #state {
      margin-bottom: 13px;
      height: 42px;
    }

    #out {
      height: 132px;
    }

    #msg { display: none; color: #d08a7f; }
    body.fail #msg { display: block; }
    #state:empty::before { content: "Loading Relapse chain..."; }
    body.done #state:empty::before { content: "GoldHEN Loaded ✔"; }
    body.fail #state:empty::before { content: "Failed to load GoldHEN"; }

    .credits {
      border-top: 1px solid #454545;
      color: #b5b5b5;
      flex: 0 0 auto;
      font-size: 13px;
      margin: 0 auto;
      padding: 8px 20px 10px;
      text-align: center;
      width: calc(100% - 64px);
      max-width: 1120px;
    }

    .credits a {
      color: #f5f5f5;
    }

    .credits a:hover,
    .credits a:focus {
      color: #a294ff;
    }

    .credits-line {
      display: inline;
    }

    .credits-line+.credits-line::before {
      color: #6f63a8;
      content: "  //  ";
    }

    .credit-label {
      color: #b5b5b5;
    }

    #state.ok,
    #out .ok {
        color:#7fd0a0;
    }
    #state.bad,
    #out .bad {
        color:#d08a7f;
    }
    #state.warn,
    #out .warn {
        color:#d8c07f;
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .container {
        justify-content: flex-start;
        padding: 24px 0 20px;
        width: calc(100% - 32px);
        max-width: 560px;
      }

      .header-section {
        padding: 20px 18px 22px;
      }

      .header-section::after {
        display: none;
      }

      .main-title {
        font-size: 44px;
      }

      .credits-line {
        display: block;
        margin: 4px 0;
      }

      .credits-line+.credits-line::before {
        content: "";
      }
    }

    @media (max-width: 430px) {
      .main-title {
        font-size: 30px;
      }
    }
</style>
  <script>
    if (window.applicationCache && window.applicationCache.status === window.applicationCache.UNCACHED) {
      window.location.replace("cache.html");
    }
  </script>
 </head>

<body>
  <main class="container">
    <section class="header-section" id="brand">
      <h1 class="main-title">PlayStation Pulse Relapse Host</h1>
      <p class="subtitle">Offline Slopkit + Relapse Auto GoldHEN</p>
      <p class="version-info">PS4 FW 13.02 – 13.52 GoldHEN v2.4b18.11</p>
      <p id="UA">Running on:</p>
    </section>

    <section class="status-container" id="wrap">
      <div class="status-label">Exploit output</div>
      <div id="state"></div>
      <div id="out"></div>
      <div id="msg">Restart your console</div>
    </section>
  </main>

  <footer class="credits">
    <div class="credits-line">
      <span class="credit-label">Premium Game Servers -</span>
      <a href="https://nodeplay.net/" class="nodeplay-link">NodePlay</a>
    </div>
    <div class="credits-line">
      <span class="credit-label">Author:</span>
      <a href="https://t.me/sudoBlackArch" class="telegram-link">BlackArch</a>
      <span style="margin: 0 1rem;">•</span>
      <span class="credit-label">Telegram:</span>
      <a href="https://t.me/PlayStation_Pulse" class="credit-link">PlayStation Pulse</a>
    </div>
    <div class="credits-line">Relapse: RAW GAME × mansoor0x © 2026</div>
  </footer>
<script>
(function () {
    if (window.applicationCache && window.applicationCache.status === window.applicationCache.UNCACHED) return;
    document.getElementById("UA").innerText += " " + navigator.userAgent;
    var moduleScript = document.createElement("script");
    moduleScript.type = "module";
    moduleScript.src = "./jb.js?v=10";
    document.body.appendChild(moduleScript);
})();
</script>
</body>

</html>
